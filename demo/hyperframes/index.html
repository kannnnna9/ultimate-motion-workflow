<!doctype html>
<html lang="id" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Ultimate Motion Workflow — demo explainer</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #101A22;
        --ink: #F2EFE6;
        --accent: #FF7A45;
        --secondary: #4FB3A9;
        --display: "DejaVu Sans", sans-serif;
        --body: "DejaVu Sans Mono", monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #stage {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        background: var(--ground); color: var(--ink);
        font-family: var(--body);
      }
      .clip { position: absolute; inset: 0; width: 1080px; height: 1920px; }
      .safe {
        position: absolute; left: 190px; top: 380px; width: 700px; height: 900px;
      }
      /* b001 — hero */
      #hero { display: flex; flex-direction: column; justify-content: center; gap: 28px; }
      #hero-title {
        font-family: var(--display); font-weight: 700; font-size: 92px;
        line-height: 1.08; letter-spacing: -1px; color: var(--ink);
        clip-path: inset(0 0 100% 0);
      }
      #hero-sub { font-size: 38px; color: var(--secondary); opacity: 0.95; max-width: 640px; }
      #ring {
        position: absolute; left: 260px; top: 700px; width: 420px; height: 420px;
        border: 6px solid var(--accent); border-radius: 50%; opacity: 0; transform: scale(0.2);
      }
      /* b002 — guess block */
      #guess { opacity: 0; }
      .tile {
        position: absolute; width: 210px; height: 210px; border: 3px solid var(--secondary);
        display: flex; align-items: center; justify-content: center;
        font-family: var(--display); font-size: 50px; color: var(--secondary);
        background: rgba(79, 179, 169, 0.06);
      }
      .tile:nth-child(1) { left: 0px;   top: 100px; }
      .tile:nth-child(2) { left: 250px; top: 260px; }
      .tile:nth-child(3) { left: 490px; top: 80px; }
      .tile:nth-child(4) { left: 120px; top: 500px; }
      /* b003 — one move */
      #onemove { opacity: 0; }
      #one-title {
        font-family: var(--display); font-weight: 700; font-size: 88px;
        line-height: 1.05; color: var(--accent);
      }
      #path-line {
        margin-top: 60px; width: 100%; height: 8px; background: var(--ink);
        transform-origin: left center; transform: scaleX(0);
      }
      #path-note { margin-top: 26px; font-size: 38px; color: var(--secondary); }
      /* end card */
      #endcard {
        display: flex; flex-direction: column; justify-content: flex-end; gap: 14px;
        opacity: 0;
      }
      #endcard .src-label { font-size: 30px; letter-spacing: 2px; color: var(--accent); }
      #endcard .src { font-size: 34px; line-height: 1.4; color: var(--ink); }
      #endcard .src small { display: block; font-size: 30px; color: var(--secondary); }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="root" data-width="1080" data-height="1920" data-fps="30" data-duration="21.66">
      <section id="scene-1" class="clip" data-start="0" data-duration="4.76">
        <div class="safe" id="hero">
          <div id="hero-title">Berhenti<br />di detik<br />pertama.</div>
          <div id="hero-sub">Bukan karena idenya buruk.</div>
        </div>
        <div id="ring"></div>
      </section>

      <section id="scene-2" class="clip" data-start="4.76" data-duration="3.8">
        <div class="safe">
          <div id="guess">
            <div class="tile">?</div>
            <div class="tile">?</div>
            <div class="tile">?</div>
            <div class="tile">?</div>
          </div>
        </div>
      </section>

      <section id="scene-3" class="clip" data-start="8.56" data-duration="5.1">
        <div class="safe" id="onemove">
          <div id="one-title">Satu<br />gerakan<br />jelas.</div>
          <div id="path-line"></div>
          <div id="path-note">Lebih kuat dari sepuluh kartu.</div>
        </div>
      </section>

      <section id="endcard" class="clip" data-start="13.66" data-duration="8">
        <div class="safe">
          <div class="src-label">SUMBER</div>
          <div class="src">
            Bang Motion — anti-ppt dan blocking kamera
            <small>Bang Tutorial · github.com/bangtutorial/bang-motion · diakses 2026-11-21</small>
          </div>
        </div>
      </section>
    </div>

    <script>
      // Timeline deterministik: tanpa Date.now(), tanpa Math.random().
      // Nilai isi (teks/palette) berasal dari brand.json dan cue.json lewat
      // window.__EPISODE__ yang disuntikkan scripts/render.py bila tersedia.
      const ep = window.__EPISODE__ || null;

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["root"] = tl;

      const cueAt = (id) => {
        if (!ep) return null;
        const c = (ep.cues || []).find((x) => x.id === id);
        return c ? c.t_ms / 1000 : null;
      };
      const t = (id, fallback) => {
        const v = cueAt(id);
        return v === null ? fallback : v;
      };

      // b001
      tl.fromTo("#hero-title",
        { clipPath: "inset(0 0 100% 0)" },
        { clipPath: "inset(0 0 0% 0)", duration: 0.9, ease: "power3.out" },
        t("c001", 0.11));
      tl.fromTo("#ring",
        { opacity: 0, scale: 0.2 },
        { opacity: 0.9, scale: 1, duration: 1.6, ease: "power2.out" },
        t("c002", 1.0));
      tl.to("#ring", { opacity: 0, duration: 0.3 }, t("c003", 2.6));

      // b002 — tebakan berserakan lalu terlipat
      const guessT = t("c004", 4.76);
      tl.to("#guess", { opacity: 1, duration: 0.4, ease: "power1.out" }, guessT);
      tl.to(".tile", {
        x: (i) => [-220, 260, -90, 180][i],
        y: (i) => [-120, -180, 240, 200][i],
        rotation: (i) => [-12, 9, -6, 14][i],
        duration: 1.2, ease: "power3.inOut", stagger: 0.06
      }, t("c005", 5.9));
      tl.to("#guess", { opacity: 0, duration: 0.5 }, t("c006", 7.6));

      // b003 — satu garis
      const oneT = t("c007", 8.56);
      tl.to("#onemove", { opacity: 1, duration: 0.3 }, oneT);
      tl.fromTo("#one-title", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power2.out" }, oneT);
      tl.fromTo("#path-line", { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: "power2.inOut" }, t("c008", 10.2));
      tl.to("#path-note", { opacity: 1, duration: 0.5 }, t("c008", 10.2) + 0.7);

      // end card — kartu sumber bertahan 8 s, tanpa gerak sama sekali
      tl.to("#endcard", { opacity: 1, duration: 0.5 }, 13.66);
    </script>
  </body>
</html>
