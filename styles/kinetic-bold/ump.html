<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=1080,height=1920"><title>UMP Kinetic Bold</title><script src="assets/gsap.min.js"></script><style>:root{--ground:#0B0B0B;--ink:#FAF7F0;--hit:#FFE500;--punch:#FF2D2D;--cool:#1B3BFF}*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--ground);color:var(--ink);font-family:DejaVu Sans,sans-serif}#stage{width:1080px;height:1920px;position:relative;background:var(--ground)}.beat{position:absolute;left:190px;width:610px;top:620px;opacity:0}.label{font:800 34px monospace;letter-spacing:8px;color:var(--hit)}h2{font-size:92px;line-height:.98;overflow-wrap:anywhere;text-transform:uppercase;margin:24px 0;color:var(--hit);transform:skew(-7deg)}p{font-size:42px;line-height:1.1;color:var(--ink)}.stripe{position:absolute;left:0;top:0;width:1080px;height:130px;background:var(--punch)}.block{position:absolute;right:-100px;top:460px;width:520px;height:260px;background:var(--cool);transform:rotate(-8deg)}</style></head><body><main id="stage" data-composition-id="root" data-width="1080" data-height="1920" data-fps="30" data-duration="__UMP_DURATION__"><div class="stripe"></div><div class="block"></div>__UMP_CARDS__</main><script>window.__EPISODE__=__UMP_EPISODE__;const ep=window.__EPISODE__;const tl=gsap.timeline({paused:true});const frameAt=frame=>frame/30;const cards=[...document.querySelectorAll(".beat")]; const seen=new Set(); const addCue=(id,frame)=>{const c=ep.cues.find(x=>x.id===id);const el=cards.find(card=>card.dataset.beat===c?.beat);if(!el)return;const at=frameAt(frame);if(!seen.has(el)){seen.add(el);tl.set(cards.filter(card=>card!==el),{opacity:0},at);tl.fromTo(el,{opacity:0,x:-36,rotation:-3},{opacity:1,x:0,rotation:0,duration:.22,ease:"power4.out",immediateRender:false},at);}else{tl.fromTo(el.querySelector("h2"),{x:-18},{x:0,duration:.22,immediateRender:false},at);} };__UMP_TIMELINE__tl.to('.block',{x:-180,rotation:4,duration:.5,ease:'power3.out'},0);window.__timelines={root:tl};</script></body></html>
