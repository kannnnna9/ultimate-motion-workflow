<!doctype html>
<html lang="id" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Ultimate Motion Workflow — kinetic bold</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0B0B0B;
        --ink: #FAF7F0;
        --hit: #FFE500;
        --punch: #FF2D2D;
        --cool: #1B3BFF;
        --display: "DejaVu Sans", sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #stage {
        position: relative; width: 1080px; height: 1920px; overflow: hidden;
        background: var(--ground); color: var(--ink);
        font-family: var(--display);
      }
      .clip { position: absolute; inset: 0; width: 1080px; height: 1920px; }

      /* Blok warna besar — partner kata, bukan latar dekoratif. */
      .slab { position: absolute; }

      /* Tipografi kinetic: huruf besar, menabrak tepi, letter-spacing negatif. */
      .kicker {
        font-size: 42px; font-weight: 800; letter-spacing: 8px;
        text-transform: uppercase;
      }
      .word {
        font-size: 136px; font-weight: 800; line-height: 0.92;
        letter-spacing: -6px; text-transform: uppercase;
      }
      .word.sm { font-size: 112px; letter-spacing: -4px; }
      .wrap { overflow-wrap: anywhere; }

      /* --- b001 hook --- */
      #s1 .slab-a {
        left: -120px; top: 430px; width: 1320px; height: 440px;
        background: var(--hit); transform: rotate(-3deg) scaleX(0); transform-origin: left center;
      }
      #s1 .slab-b {
        left: -120px; top: 990px; width: 1320px; height: 230px;
        background: var(--cool); transform: rotate(2deg) scaleX(0); transform-origin: right center;
      }
      #s1 .kicker { position: absolute; left: 190px; top: 396px; color: var(--punch); }
      #s1 .hook {
        position: absolute; left: 190px; top: 470px; width: 700px;
        color: #0B0B0B; z-index: 3;
      }
      #s1 .hook .word { color: #0B0B0B; }
      #s1 .sub {
        position: absolute; left: 190px; top: 1010px; width: 700px;
        font-size: 66px; font-weight: 800; line-height: 1.02;
        letter-spacing: -2px; color: var(--ink); text-transform: uppercase;
      }

      /* --- b002 tiga kata bertumbukan --- */
      #s2 .slab-c { left: 0; top: 0; width: 1080px; height: 1080px; background: var(--punch); }
      #s2 .stack { position: absolute; left: 190px; top: 500px; width: 700px; }
      #s2 .word { color: var(--ink); }
      #s2 .word:nth-child(2) { color: #0B0B0B; }
      #s2 .bar {
        position: absolute; left: 190px; top: 1180px; width: 700px; height: 64px;
        background: var(--hit); transform: scaleX(0); transform-origin: left center;
      }

      /* --- b003 payoff --- */
      #s3 .slab-d { left: 0; top: 760px; width: 1080px; height: 520px; background: var(--hit); }
      #s3 .payoff {
        position: absolute; left: 190px; top: 760px; width: 700px;
        color: #0B0B0B; z-index: 3;
      }
      #s3 .note {
        position: absolute; left: 190px; top: 1090px; width: 620px;
        font-size: 54px; font-weight: 800; letter-spacing: -1px; color: var(--ink);
      }

      /* --- end card --- */
      #endcard .slab-e { left: 0; top: 0; width: 1080px; height: 1920px; background: var(--ground); }
      #endcard .src-label { position: absolute; left: 190px; top: 700px; color: var(--hit); font-size: 32px; letter-spacing: 10px; font-weight: 800; }
      #endcard .src { position: absolute; left: 190px; top: 766px; width: 620px; font-size: 40px; font-weight: 800; line-height: 1.22; letter-spacing: -1px; }
      #endcard .src small { display: block; margin-top: 16px; font-size: 30px; font-weight: 400; color: var(--hit); letter-spacing: 0; line-height: 1.3; }
      #endcard .stripe { position: absolute; left: 0; top: 0; width: 1080px; height: 120px; background: var(--punch); }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="root" data-width="1080" data-height="1920" data-fps="30" data-duration="21.66">

      <section id="s1" class="clip" data-start="0" data-duration="4.76">
        <div class="slab slab-a"></div>
        <div class="slab slab-b"></div>
        <div class="kicker">STOP</div>
        <div class="hook">
          <div class="word">DETIK</div>
          <div class="word">PERTAMA</div>
        </div>
        <div class="sub">Ide bagus kalah<br />sama tiga detik.</div>
      </section>

      <section id="s2" class="clip" data-start="4.76" data-duration="3.8">
        <div class="slab slab-c"></div>
        <div class="stack">
          <div class="word sm">BUKAN</div>
          <div class="word sm">IDE</div>
          <div class="word sm">BURUK.</div>
        </div>
        <div class="bar"></div>
      </section>

      <section id="s3" class="clip" data-start="8.56" data-duration="5.1">
        <div class="slab slab-d"></div>
        <div class="payoff">
          <div class="word sm">SATU</div>
          <div class="word sm">GERAKAN</div>
        </div>
        <div class="note wrap">Kalahkan sepuluh kartu.</div>
      </section>

      <section id="endcard" class="clip" data-start="13.66" data-duration="8">
        <div class="slab slab-e"></div>
        <div class="stripe"></div>
        <div class="src-label">SUMBER</div>
        <div class="src wrap">
          Bang Motion — anti-ppt dan blocking kamera
          <small>Bang Tutorial · github.com/bangtutorial/bang-motion · diakses 2026-11-21</small>
        </div>
      </section>

    </div>

    <script>
      // Timeline deterministik; waktu dari cue episode bila window.__EPISODE__ ada.
      const ep = window.__EPISODE__ || null;
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["root"] = tl;

      const cueAt = (id) => {
        if (!ep) return null;
        const c = (ep.cues || []).find((x) => x.id === id);
        return c ? c.t_ms / 1000 : null;
      };
      const t = (id, fallback) => {
        const v = cueAt(id);
        return v === null ? fallback : v;
      };

      // b001 — blok menabrak layar, kata muncul dari baliknya
      tl.to("#s1 .slab-a", { scaleX: 1, duration: 0.34, ease: "power4.out" }, t("c001", 0.11));
      tl.fromTo("#s1 .hook .word",
        { y: 120, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.22, ease: "power4.out", stagger: 0.09 },
        t("c001", 0.11) + 0.16);
      tl.fromTo("#s1 .kicker",
        { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.2, ease: "power2.out" },
        t("c002", 1.0));
      tl.to("#s1 .slab-b", { scaleX: 1, duration: 0.4, ease: "power4.out" }, t("c002", 1.0));
      tl.fromTo("#s1 .sub",
        { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "power3.out" },
        t("c002", 1.0) + 0.3);
      tl.to("#s1 .hook .word", { y: -40, opacity: 0, duration: 0.18, stagger: 0.04 }, t("c003", 2.6));

      // b002 — tiga kata, cut tajam
      tl.fromTo("#s2 .slab-c", { y: 1080 }, { y: 0, duration: 0.24, ease: "power4.inOut" }, t("c004", 4.76));
      tl.fromTo("#s2 .word",
        { scale: 1.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.18, ease: "power4.out", stagger: 0.14 },
        t("c004", 4.76) + 0.14);
      tl.to("#s2 .bar", { scaleX: 1, duration: 0.26, ease: "power4.out" }, t("c005", 5.9));
      tl.to("#s2 .stack", { x: -30, duration: 0.12, repeat: 3, yoyo: true, ease: "none" }, t("c005", 5.9) + 0.3);
      tl.to("#s2", { opacity: 0, duration: 0.14 }, t("c006", 7.6));

      // b003 — payoff
      tl.fromTo("#s3 .slab-d", { scaleY: 0 }, { scaleY: 1, duration: 0.22, ease: "power4.out" }, t("c007", 8.56));
      tl.fromTo("#s3 .payoff .word",
        { x: -80, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.2, ease: "power4.out", stagger: 0.1 },
        t("c007", 8.56) + 0.12);
      tl.fromTo("#s3 .note",
        { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.26, ease: "power3.out" },
        t("c008", 10.2));

      // end card — kartu sumber, tanpa gerak
      tl.to("#endcard", { opacity: 1, duration: 0.3 }, 13.66);
    </script>
  </body>
</html>
