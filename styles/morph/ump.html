<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=1080,height=1920"><title>UMP Morph</title><script src="assets/gsap.min.js"></script><style>
:root{--ground:#0E0E12;--ink:#F3F2EE;--accent:#7B5CFF;--secondary:#22C9A6;--tertiary:#FF6B4A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ground)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ground);font-family:"Inter","Helvetica Neue",Arial,sans-serif}
#field{position:absolute;inset:0;background:var(--accent);clip-path:inset(100% 0 0 0)}
#stageShape{position:absolute;left:140px;top:420px;width:800px;height:800px;z-index:3;transform-origin:50% 50%}
#beat{position:absolute;left:72px;right:72px;bottom:200px;text-align:center;opacity:0;z-index:5;background:rgba(14,14,18,.88);border-radius:32px;padding:34px 30px}
#beat .tag{display:inline-block;font:800 28px/1 "Inter",sans-serif;letter-spacing:.30em;color:var(--secondary);text-transform:uppercase}
#beat h1{margin-top:26px;font:800 92px/1.02 "Inter",sans-serif;color:var(--ink);letter-spacing:-.03em}
#beat p{margin-top:24px;font:400 40px/1.42 "Inter",sans-serif;color:var(--ink);opacity:.66}
#label{position:absolute;left:120px;right:120px;top:170px;text-align:center;background:rgba(14,14,18,.92);padding:16px 0;border-radius:18px;font:700 26px/1 "Inter",sans-serif;letter-spacing:.34em;color:#E6E4FF;opacity:1;text-transform:uppercase}
</style></head><body data-composition-id="root" data-width="1080" data-height="1920" data-fps="30" data-duration="__UMP_DURATION__">
<div id="cards" style="display:none">__UMP_CARDS__</div>
<div id="stage">
  <div id="field"></div>
  <div id="label">one shape · every story</div>
  <svg id="stageShape" viewBox="-260 -260 520 520">
    <path id="form" fill="var(--ink)" d=""/>
  </svg>
  <div id="beat"><div class="tag"></div><h1></h1><p></p></div>
</div>
<script>
const EP = __UMP_EPISODE__;
const DURATION = __UMP_DURATION__;
/* Cards arrive as markup in #cards; read them from the DOM rather than as JSON. */
const CARDS_NODES = Array.prototype.slice.call(document.querySelectorAll('#cards .beat'));
const CARDS_DATA = CARDS_NODES.map(function(el){
  return {
    tag: (el.querySelector('.label') || {}).textContent || '',
    headline: (el.querySelector('h2') || {}).textContent || '',
    body: (el.querySelector('p') || {}).textContent || ''
  };
});


/* Every form is 12 points at the same angular order, first point at 12 o'clock.
   Equal vertex counts + aligned first vertex is the condition that stops a
   morph from knotting. */
const N = 12;                  /* equalVertex: every form is built from N points */
const TAU = Math.PI * 2;

function ring(radiusFn){
  const pts = [];
  for(let i=0;i<N;i++){
    const a = -Math.PI/2 + i * TAU / N;
    const r = radiusFn(a, i);
    pts.push([Math.cos(a)*r, Math.sin(a)*r]);
  }
  return pts;
}

const FORMS = {
  circle:   ring(() => 120),
  droplet:  ring(a => 120 + 46*Math.cos(a) + 30*Math.max(0,Math.cos(a))),
  star:     ring((a,i) => (i%2===0 ? 210 : 96)),
  hexagon:  ring((a,i) => 90 / Math.cos(((i%6)*TAU/6 + TAU/12) - a + Math.PI/2) || 160),
  capsule:  ring(() => 96),
  pin:      ring((a,i) => (Math.sin(a) > 0.55 ? 46 : 150)),
  heartish: ring(a => 120 + 34*Math.cos(3*a)),
  square:   ring((a,i) => 150 / Math.max(Math.abs(Math.cos(a)), Math.abs(Math.sin(a))))
};

function toPath(pts, sx, sy){
  sx = sx === undefined ? 1 : sx; sy = sy === undefined ? 1 : sy;
  return 'M' + pts.map(p => (p[0]*sx).toFixed(2) + ' ' + (p[1]*sy).toFixed(2)).join('L') + 'Z';
}

const form = document.getElementById('form');
form.setAttribute('d', toPath(FORMS.circle));

/* squash: 12% stretch rides on the wrapper so it never fights the path interpolation. */
const svgEl = document.getElementById('stageShape');

const tl = gsap.timeline({paused:true});
const MORPH_EASE = 'power1.inOut';   /* morphEase: fast mid, 3-frame cushions */   /* stands in for cubic-bezier(.7,0,.3,1) + cushions */
const CUSHION = 3/30;
const MORPH_LEN = 0.62;

/* colourField: the ground colour wipes on each beat instead of crossfading */
tl.fromTo('#field',{clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(0% 0 0 0)',duration:0.42,ease:'power2.out'},0);
tl.fromTo(svgEl,{scale:0,rotate:-40},{scale:1,rotate:0,duration:0.42,ease:'back.out(1.7)'},0.06);

const CHAIN = ['circle','droplet','star','hexagon','capsule','pin','heartish','square'];
const BEAT_LEN = Math.max(1.85, DURATION/4);

/* A->B always detours through the circle: A -> bridge -> B, each leg short.
   Interpolating straight A->B is what produces self-intersection. */

CARDS_DATA.forEach(function(card,i){
  const start = 0.9 + i * BEAT_LEN;
  if(start + MORPH_LEN*2 > DURATION - 0.6) return;
  const a = CHAIN[i % CHAIN.length];
  const b = CHAIN[(i+1) % CHAIN.length];

  tl.call(function(){
    document.querySelector('#beat .tag').textContent = card.tag || ('MORPH ' + String(i+1).padStart(2,'0'));
    document.querySelector('#beat h1').textContent = card.headline || '';
    document.querySelector('#beat p').textContent = card.body || '';
  },null,start);

  tl.fromTo('#beat',{opacity:0,y:20},{opacity:1,y:0,duration:0.28,ease:'power2.out'},start);
  tl.to('#beat',{opacity:0,duration:0.24,ease:'power2.in'},start+BEAT_LEN-0.28);

  /* leg 1: A -> bridge (circle) */
  tl.call(function(){ form.setAttribute('d', toPath(FORMS[a])); },null,start+0.02);
  tl.to({t:0},{t:1,duration:MORPH_LEN,ease:MORPH_EASE,onUpdate:function(){
    const k = this.progress();
    const from = FORMS[a], mid = FORMS.circle;
    const pts = from.map(function(p,idx){
      return [p[0]+(mid[idx][0]-p[0])*k, p[1]+(mid[idx][1]-p[1])*k];
    });
    form.setAttribute('d', toPath(pts));
    svgEl.setAttribute('transform','rotate(' + (k*8).toFixed(1) + ') scale(' + (1 + 0.12*Math.sin(k*Math.PI)).toFixed(3) + ')');
  }},start+0.02);

  /* leg 2: bridge -> B */
  tl.to({t:0},{t:1,duration:MORPH_LEN,ease:MORPH_EASE,onUpdate:function(){
    const k = this.progress();
    const to = FORMS[b], mid = FORMS.circle;
    const pts = mid.map(function(p,idx){
      return [p[0]+(to[idx][0]-p[0])*k, p[1]+(to[idx][1]-p[1])*k];
    });
    form.setAttribute('d', toPath(pts));
    svgEl.setAttribute('transform','rotate(' + (-8 + k*8).toFixed(1) + ') scale(' + (1 + 0.12*Math.sin(k*Math.PI)).toFixed(3) + ')');
  }},start+0.02+MORPH_LEN+CUSHION);

  /* colour field wipes on the beat, behind the shape */
  tl.fromTo('#field',{clipPath:'inset(0% 0 0 0)'},
    {clipPath:'inset(0% 0 0 0)',duration:0.001},start+BEAT_LEN-0.3);
  tl.call(function(){
    const hues = ['var(--accent)','var(--secondary)','var(--tertiary)','#1C1B22','#2A2740'];
    document.getElementById('field').style.background = hues[i % hues.length];
  },null,start+BEAT_LEN-0.3);
});

const END = DURATION - 1.0;
tl.call(function(){ form.setAttribute('d', toPath(FORMS.square)); },null,END);
tl.fromTo(svgEl,{scale:1.0,rotate:-8},{scale:0.92,rotate:0,duration:0.5,ease:'back.out(1.4)'},END);
tl.fromTo('#beat',{opacity:0},{opacity:1,duration:0.34,ease:'power2.out'},END+0.10);
tl.call(function(){
  document.querySelector('#beat .tag').textContent = 'ump';
  document.querySelector('#beat h1').textContent = 'MORPH';
  document.querySelector('#beat p').textContent = 'Satu bentuk, banyak cerita.';
},null,END);

window.__timelines={root:tl};
window.__UMP_READY__=true;
</script>
</body></html>
