<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>UMP WebGL 3D Stage</title>
<script src="assets/gsap.min.js"></script>
<style>
  :root { --ground: #070B14; --ink: #F6F1E7; --accent: #FF7A2F; --gold: #F5B73B; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); color: var(--ink); font-family: "DejaVu Sans", sans-serif; }
  #stage { width: 1080px; height: 1920px; position: relative; overflow: hidden; background: radial-gradient(circle at 50% 42%, #18233A 0%, #070B14 72%); }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  .hud-top { position: absolute; left: 96px; right: 96px; top: 96px; display: flex; justify-content: space-between; align-items: center; font: 700 24px "DejaVu Sans Mono", monospace; letter-spacing: 3px; color: rgba(246,241,231,0.68); z-index: 3; }
  .hud-pill { padding: 8px 18px; border: 1px solid rgba(255,122,47,0.45); border-radius: 999px; background: rgba(7,11,20,0.55); color: var(--gold); }
  .beat { position: absolute; left: 96px; right: 96px; top: 210px; opacity: 0; z-index: 3; pointer-events: none; }
  .label { color: var(--accent); font: 700 26px "DejaVu Sans Mono", monospace; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 14px; }
  h2 { font-size: 74px; line-height: 1.04; margin: 0 0 18px 0; color: var(--ink); text-shadow: 0 12px 34px rgba(0,0,0,0.65); }
  p { font-size: 34px; line-height: 1.3; margin: 0; max-width: 820px; color: rgba(246,241,231,0.86); text-shadow: 0 6px 20px rgba(0,0,0,0.7); }
  .progress-wrap { position: absolute; left: 96px; right: 96px; bottom: 130px; height: 6px; background: rgba(255,255,255,0.12); border-radius: 999px; overflow: hidden; z-index: 3; }
  .rail { width: 100%; height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); transform-origin: left center; transform: scaleX(0); }
</style>
</head>
<body>
<main id="stage" data-composition-id="root" data-width="1080" data-height="1920" data-fps="30" data-duration="__UMP_DURATION__">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div class="hud-top">
    <span>FORMULA // 3D</span>
    <span class="hud-pill">WEBGL STAGE</span>
  </div>
  __UMP_CARDS__
  <div class="progress-wrap"><div class="rail"></div></div>
</main>
<script>
window.__EPISODE__ = __UMP_EPISODE__;
const ep = window.__EPISODE__;
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { antialias: true, alpha: true, preserveDrawingBuffer: true });

// Minimal deterministic 3D math + lighting engine
function m4() { return new Float32Array(16); }
function perspective(fov, aspect, near, far) {
  const f = 1 / Math.tan(fov / 2), nf = 1 / (near - far), o = m4();
  o[0] = f / aspect; o[5] = f; o[10] = (far + near) * nf; o[11] = -1; o[14] = 2 * far * near * nf;
  return o;
}
function mul(a, b) {
  const o = m4();
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++)
    o[c * 4 + r] = a[r] * b[c * 4] + a[r + 4] * b[c * 4 + 1] + a[r + 8] * b[c * 4 + 2] + a[r + 12] * b[c * 4 + 3];
  return o;
}
function xform(tx, ty, tz, rx, ry, rz, sx, sy, sz) {
  const cx = Math.cos(rx), sxn = Math.sin(rx), cy = Math.cos(ry), syn = Math.sin(ry), cz = Math.cos(rz), szn = Math.sin(rz);
  const o = m4();
  o[0] = cy * cz * sx; o[1] = (sxn * syn * cz + cx * szn) * sx; o[2] = (-cx * syn * cz + sxn * szn) * sx;
  o[4] = -cy * szn * sy; o[5] = (-sxn * syn * szn + cx * cz) * sy; o[6] = (cx * syn * szn + sxn * cz) * sy;
  o[8] = syn * sz; o[9] = -sxn * cy * sz; o[10] = cx * cy * sz;
  o[12] = tx; o[13] = ty; o[14] = tz; o[15] = 1;
  return o;
}

let drawScene = () => {};
if (gl) {
  const vs = `
    attribute vec3 aPos;
    attribute vec3 aNorm;
    uniform mat4 uProj;
    uniform mat4 uModel;
    varying vec3 vNorm;
    varying vec3 vWorld;
    void main() {
      vec4 w = uModel * vec4(aPos, 1.0);
      vWorld = w.xyz;
      vNorm = mat3(uModel) * aNorm;
      gl_Position = uProj * w;
    }`;
  const fs = `
    precision mediump float;
    varying vec3 vNorm;
    varying vec3 vWorld;
    uniform vec3 uColor;
    uniform vec3 uRim;
    uniform float uAlpha;
    void main() {
      vec3 n = normalize(vNorm);
      vec3 l1 = normalize(vec3(0.55, 0.8, 0.9));
      vec3 l2 = normalize(vec3(-0.8, -0.3, 0.5));
      float diff = max(dot(n, l1), 0.0);
      float fill = max(dot(n, l2), 0.0) * 0.35;
      vec3 viewDir = normalize(-vWorld);
      float rim = pow(1.0 - max(dot(n, viewDir), 0.0), 2.4);
      vec3 h = normalize(l1 + viewDir);
      float spec = pow(max(dot(n, h), 0.0), 36.0) * 0.55;
      vec3 col = uColor * (0.24 + diff * 0.85 + fill) + uRim * rim * 0.65 + vec3(1.0) * spec;
      gl_FragColor = vec4(col, uAlpha);
    }`;
  const compile = (t, src) => {
    const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  // Build smooth lathe/cylinder + sphere geometries
  function makeLathe(profile, segs = 28) {
    const pos = [], norm = [], idx = [];
    for (let i = 0; i < profile.length; i++) {
      const [r, y] = profile[i];
      const [r0, y0] = profile[Math.max(0, i - 1)];
      const [r1, y1] = profile[Math.min(profile.length - 1, i + 1)];
      const dy = y1 - y0, dr = r1 - r0;
      const len = Math.hypot(dy, dr) || 1;
      const nr = dy / len, ny = -dr / len;
      for (let j = 0; j <= segs; j++) {
        const a = (j / segs) * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
        pos.push(r * ca, y, r * sa);
        norm.push(nr * ca, ny, nr * sa);
      }
    }
    const stride = segs + 1;
    for (let i = 0; i < profile.length - 1; i++) {
      for (let j = 0; j < segs; j++) {
        const a = i * stride + j, b = a + stride;
        idx.push(a, b, a + 1, b, b + 1, a + 1);
      }
    }
    return { pos: new Float32Array(pos), norm: new Float32Array(norm), idx: new Uint16Array(idx) };
  }

  function makeSphere(r = 1, lat = 14, lon = 20) {
    const pos = [], norm = [], idx = [];
    for (let i = 0; i <= lat; i++) {
      const th = (i / lat) * Math.PI, st = Math.sin(th), ct = Math.cos(th);
      for (let j = 0; j <= lon; j++) {
        const ph = (j / lon) * Math.PI * 2, cp = Math.cos(ph), sp = Math.sin(ph);
        const x = st * cp, y = ct, z = st * sp;
        pos.push(r * x, r * y, r * z); norm.push(x, y, z);
      }
    }
    const s = lon + 1;
    for (let i = 0; i < lat; i++) for (let j = 0; j < lon; j++) {
      const a = i * s + j, b = a + s;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
    return { pos: new Float32Array(pos), norm: new Float32Array(norm), idx: new Uint16Array(idx) };
  }

  function upload(g) {
    const pb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, pb); gl.bufferData(gl.ARRAY_BUFFER, g.pos, gl.STATIC_DRAW);
    const nb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, nb); gl.bufferData(gl.ARRAY_BUFFER, g.norm, gl.STATIC_DRAW);
    const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, g.idx, gl.STATIC_DRAW);
    return { pb, nb, ib, count: g.idx.length };
  }

  // Bottle silhouette + ring + sphere
  const bottle = upload(makeLathe([
    [0.01, -1.65], [0.58, -1.65], [0.64, -1.52], [0.62, -0.65],
    [0.54, 0.15], [0.60, 0.45], [0.52, 0.82], [0.28, 1.18],
    [0.24, 1.56], [0.29, 1.62], [0.25, 1.68], [0.01, 1.68]
  ], 32));
  const cap = upload(makeLathe([[0.01, 1.66], [0.30, 1.66], [0.30, 1.82], [0.01, 1.82]], 24));
  const orb = upload(makeSphere(1, 14, 20));

  const aPos = gl.getAttribLocation(prog, 'aPos');
  const aNorm = gl.getAttribLocation(prog, 'aNorm');
  const uProj = gl.getUniformLocation(prog, 'uProj');
  const uModel = gl.getUniformLocation(prog, 'uModel');
  const uColor = gl.getUniformLocation(prog, 'uColor');
  const uRim = gl.getUniformLocation(prog, 'uRim');
  const uAlpha = gl.getUniformLocation(prog, 'uAlpha');

  const proj = perspective(0.75, 1080 / 1920, 0.1, 40);
  gl.uniformMatrix4fv(uProj, false, proj);

  function drawMesh(m, model, col, rim, alpha = 1) {
    gl.bindBuffer(gl.ARRAY_BUFFER, m.pb); gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, m.nb); gl.enableVertexAttribArray(aNorm); gl.vertexAttribPointer(aNorm, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.ib);
    gl.uniformMatrix4fv(uModel, false, model);
    gl.uniform3fv(uColor, col);
    gl.uniform3fv(uRim, rim);
    gl.uniform1f(uAlpha, alpha);
    gl.drawElements(gl.TRIANGLES, m.count, gl.UNSIGNED_SHORT, 0);
  }

  const state = { t: 0, camZ: -6.2, camY: -0.35, rotY: 0, rotX: 0.14, spread: 1 };
  window.__3D_STATE__ = state;

  drawScene = () => {
    gl.viewport(0, 0, 1080, 1920);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    const t = state.t;
    const bob = Math.sin(t * 2.1) * 0.08;
    const bm = xform(0, state.camY + bob, state.camZ, state.rotX, state.rotY + t * 0.9, Math.sin(t * 0.7) * 0.08, 1.05, 1.05, 1.05);
    drawMesh(bottle, bm, [0.24, 0.07, 0.03], [1.0, 0.48, 0.18], 0.96);
    drawMesh(cap, bm, [0.95, 0.25, 0.12], [1.0, 0.82, 0.4], 1.0);

    // Orbiting 3D ingredient spheres (citrus, spice, caramel, fizz)
    const cols = [[1.0, 0.52, 0.14], [0.96, 0.74, 0.22], [0.65, 0.92, 0.35], [0.85, 0.94, 1.0]];
    for (let i = 0; i < 10; i++) {
      const a = t * 1.4 + i * 0.628;
      const rad = (1.15 + (i % 3) * 0.35) * state.spread;
      const x = Math.cos(a) * rad;
      const z = state.camZ + Math.sin(a) * rad;
      const y = state.camY - 0.9 + ((i * 0.37 + t * 0.55) % 2.6);
      const s = i % 2 === 0 ? 0.14 : 0.085;
      drawMesh(orb, xform(x, y, z, a, a * 0.7, 0, s, s, s), cols[i % cols.length], [1.0, 0.85, 0.6], 0.92);
    }
  };
}

const tl = gsap.timeline({ paused: true, onUpdate: () => { window.__3D_STATE__.t = tl.time(); } });
const frameAt = f => f / 30;
const cards = [...document.querySelectorAll('.beat')];
const seen = new Set();

// Beat visibility is derived from time, never from accumulated timeline state:
// a scrubber (seek) must land on exactly the same frame as a forward play.
const cueWindows = [];
const addCue = (id, frame) => {
  const c = ep.cues.find(x => x.id === id);
  const el = cards.find(card => card.dataset.beat === c?.beat);
  if (!el) return;
  cueWindows.push({ at: frameAt(frame), el, idx: cueWindows.length });
};

function syncBeats(t) {
  let current = null;
  for (const w of cueWindows) if (t >= w.at) current = w;
  for (const w of cueWindows) {
    const on = w === current;
    w.el.style.opacity = on ? '1' : '0';
    w.el.style.transform = on ? 'translateY(0px)' : 'translateY(36px)';
  }
  if (current) {
    const local = Math.min(1, (t - current.at) / 0.42);
    const eased = 1 - Math.pow(1 - local, 3);
    current.el.style.transform = `translateY(${(1 - eased) * 36}px)`;
    const k = current.idx;
    const s = window.__3D_STATE__;
    const ease = 1 - Math.pow(1 - Math.min(1, (t - current.at) / 0.9), 2);
    s.camZ = -6.2 + ((-5.2 - (k % 2) * 0.9) + 6.2) * ease;
    s.camY = -0.35 + ((-0.45 + (k % 3) * 0.14) + 0.35) * ease;
    s.rotY = (k * 1.15) * ease;
    s.spread = 1 + ((0.9 + (k % 3) * 0.22) - 1) * ease;
  }
}
window.__SYNC_BEATS__ = syncBeats;

__UMP_TIMELINE__
const totalDur = Number(document.getElementById('stage').dataset.duration) || 24;
tl.to('.rail', { scaleX: 1, duration: totalDur, ease: 'none' }, 0);
tl.to(window.__3D_STATE__, { t: totalDur, duration: totalDur, ease: 'none' }, 0);
window.__3D_RENDER__ = () => { syncBeats(tl.time()); drawScene(); };
window.__timelines = { root: tl };
drawScene();
</script>
</body>
</html>
