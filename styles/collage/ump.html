<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=1080,height=1920"><title>UMP Collage</title><script src="assets/gsap.min.js"></script><style>
:root{--ground:#E4DAC6;--ink:#141210;--accent:#C1272D;--secondary:#1B3A63;--paper:#F4EEDF}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ground)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ground);font-family:"Courier New",monospace;font-weight:700}
#headline h1 span{display:inline-block;max-width:100%}
/* newsprint ground: two rotated paper sheets + halftone dot field */
#sheet{position:absolute;inset:-40px;background:var(--paper);transform:rotate(-1.2deg);box-shadow:0 18px 60px rgba(0,0,0,.22)}
#sheet2{position:absolute;inset:-30px;background:#EDE4D2;transform:rotate(0.8deg);z-index:-1}
#halftone{position:absolute;inset:0;opacity:.30;mix-blend-mode:multiply}
.cut{position:absolute;will-change:transform}
.clip{position:absolute;background:var(--ink);border-radius:0;filter:url(#torn);box-shadow:0 0 0 6px var(--paper),0 8px 26px rgba(0,0,0,.28)} /* whiteEdge: 6px scissor cut */
#headline{left:96px;top:250px;width:840px;z-index:6}
#headline h1{font:900 96px/1.0 "Arial Black",Arial,sans-serif;color:var(--ink);text-transform:uppercase;letter-spacing:-.04em}
#headline h1 em{font-style:normal;color:var(--accent);-webkit-text-stroke:3px var(--ink)}
#headline .red{display:inline-block;background:var(--accent);color:var(--paper);padding:0 10px;transform:rotate(-2deg);max-width:100%}
#bignum{position:absolute;left:26px;top:150px;z-index:0;font:900 300px/1 "Arial Black",Arial,sans-serif;color:var(--secondary);opacity:.20;z-index:1}
#beat{position:absolute;left:80px;right:80px;bottom:300px;z-index:8}
#beat .tag{display:inline-block;background:var(--ink);color:var(--paper);font:700 34px/1 "Courier New",monospace;padding:12px 24px;letter-spacing:.2em}
#beat p{margin-top:28px;font:700 46px/1.34 "Courier New",monospace;color:var(--ink);background:var(--paper);padding:22px 24px;border-left:14px solid var(--accent);max-width:900px}
#tape{position:absolute;width:230px;height:56px;z-index:2;background:rgba(244,238,223,.72);box-shadow:0 2px 10px rgba(0,0,0,.12)}
#stamp{position:absolute;right:70px;bottom:150px;border:8px solid var(--accent);color:var(--accent);font:900 40px/1 "Arial Black",Arial;padding:16px 26px;transform:rotate(-8deg);opacity:0;z-index:9}
</style></head><body data-composition-id="root" data-width="1080" data-height="1920" data-fps="30" data-duration="__UMP_DURATION__">
<div id="cards" style="display:none">__UMP_CARDS__</div>
<div id="stage">
  <div id="sheet2"></div>
  <div id="sheet"></div>
  <svg id="halftone" viewBox="0 0 1080 1920" preserveAspectRatio="none"><defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(26)">
      <circle cx="11" cy="11" r="4.2" fill="#141210"/>
    </pattern>
    <filter id="torn"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/></filter>
  </defs><rect width="1080" height="1920" fill="url(#dots)"/></svg>
  <div id="bignum">01</div>
  <div class="clip" style="left:640px;top:180px;width:420px;height:520px;transform:rotate(4deg)"></div>
  <div class="clip" style="left:120px;top:760px;width:300px;height:300px;background:#C1272D;border-radius:50%"></div>
  <div class="clip" style="left:560px;top:880px;width:460px;height:180px;background:#1B3A63"></div>
  <div id="headline"><h1></h1></div>
  <div id="beat"><div class="tag"></div><p></p></div>
  <div id="tape" style="left:600px;top:150px;transform:rotate(-28deg)"></div>
  <div id="stamp">† COLLAGE †</div>
</div>
<script>
const EP = __UMP_EPISODE__;
const DURATION = __UMP_DURATION__;
/* Cards arrive as markup in #cards; read them from the DOM rather than as JSON. */
const CARDS_NODES = Array.prototype.slice.call(document.querySelectorAll('#cards .beat'));
const CARDS_DATA = CARDS_NODES.map(function(el){
  return {
    tag: (el.querySelector('.label') || {}).textContent || '',
    headline: (el.querySelector('h2') || {}).textContent || '',
    body: (el.querySelector('p') || {}).textContent || ''
  };
});

/* stepped12: the clock is quantised to a 12 fps grid; nothing interpolates */
const STEP = 1/12;              /* hand-made motion runs on a 12 fps grid */
const JIT = 2;            /* handJitter: +-2px placement offset re-rolled each step */                  /* +-2px placement jitter per step */

/* Stepped clock: quantise to the 12 fps grid, never interpolate. */
function stepped(t){ return Math.round(t / STEP) * STEP; }
function jitter(seed){
  const x = Math.sin(seed * 127.1) * 43758.5453;
  const y = Math.sin(seed * 311.7) * 24634.6345;
  return [(x - Math.floor(x) - 0.5) * 2 * JIT, (y - Math.floor(y) - 0.5) * 2 * JIT];
}

const tl = gsap.timeline({paused:true});

/* Each cut lands by hand: rotate in hard on a 2-step snap, then a jitter hold. */
tl.fromTo('#headline',{opacity:0,y:-40,rotate:-6,scale:1.10},
  {opacity:1,y:0,rotate:-1.5,scale:1,duration:STEP*2,ease:'steps(2)'},0);
tl.fromTo('.clip',{opacity:0,scale:1.3,rotate:14},
  {opacity:1,scale:1,rotate:0,duration:STEP*2,stagger:STEP*2,ease:'steps(2)'},STEP*2);

/* Halftone multiply breathes on the step grid, not smoothly. */
tl.fromTo('#halftone',{opacity:0.10},{opacity:0.30,duration:STEP*3,ease:'steps(3)'},0);

/* Hand jitter: alternate offsets every step while the card holds. */
for(let t=0;t<DURATION;t+=STEP){
  const [dx,dy] = jitter(t*100);
  tl.set('#stage',{x:dx,y:dy},stepped(t));
}

const BEAT_LEN = Math.max(2.0, DURATION/4);
CARDS_DATA.forEach(function(card,i){
  const start = stepped(1.4 + i*BEAT_LEN);
  if(start > DURATION - 0.5) return;
  const tagEl = document.querySelector('#beat .tag');
  const pEl = document.querySelector('#beat p');
  const hEl = document.querySelector('#headline h1');
  tl.call(function(){
    tagEl.textContent = card.tag || ('CUT ' + String(i+1).padStart(2,'0'));
    hEl.innerHTML = '';
    const words = (card.headline||'').split(' ');
    words.forEach(function(w,wi){
      const span = document.createElement('span');
      span.textContent = w + ' ';
      if(wi === words.length-1 || wi % 3 === 2) span.className='red';
      hEl.appendChild(span);
    });
    pEl.textContent = card.body || '';
    document.getElementById('bignum').textContent = String(i+1).padStart(2,'0');
  },null,start);
  tl.fromTo('#headline',{opacity:0,scale:1.12,rotate:2.4},
    {opacity:1,scale:1,rotate:-1.5,duration:STEP*2,ease:'steps(2)'},start);
  tl.fromTo('#beat',{opacity:0,y:26},{opacity:1,y:0,duration:STEP*2,ease:'steps(2)'},start+STEP);
  tl.to('#beat',{opacity:0,duration:STEP*2,ease:'steps(2)'},start+BEAT_LEN-STEP*3);
});

/* Paper-flip transition into the stamp, then torn-paper settle. */
const END = DURATION - 1.0;
tl.to('#sheet',{rotate:'-=6',x:-60,duration:STEP*4,ease:'steps(4)'},END);
tl.fromTo('#stamp',{opacity:0,scale:1.6,rotate:-20},{opacity:1,scale:1,rotate:-8,duration:STEP*3,ease:'steps(3)'},END+STEP*2);

window.__timelines={root:tl};
window.__UMP_READY__=true;
</script>
</body></html>
