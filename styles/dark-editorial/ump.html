<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=1080,height=1920"><title>UMP Dark Editorial</title><script src="assets/gsap.min.js"></script><style>:root{--ground:#101A22;--ink:#F2EFE6;--accent:#FF7A45}*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--ground);color:var(--ink);font-family:DejaVu Sans,sans-serif}#stage{width:1080px;height:1920px;padding:170px 120px;position:relative;background:var(--ground)}.beat{position:absolute;left:160px;width:660px;top:470px;opacity:0}.label{color:var(--accent);font:700 30px monospace;letter-spacing:6px}h2{font-size:88px;line-height:1.02;overflow-wrap:anywhere;margin:28px 0;color:var(--ink)}p{font-size:42px;line-height:1.25;max-width:780px}.rail{position:absolute;left:120px;right:120px;bottom:220px;height:10px;background:var(--accent);transform-origin:left center}</style></head><body><main id="stage" data-composition-id="root" data-width="1080" data-height="1920" data-fps="30" data-duration="__UMP_DURATION__">__UMP_CARDS__<div class="rail"></div></main><script>window.__EPISODE__=__UMP_EPISODE__;const ep=window.__EPISODE__;const tl=gsap.timeline({paused:true});const frameAt=frame=>frame/30;const cards=[...document.querySelectorAll(".beat")]; const seen=new Set(); const addCue=(id,frame)=>{const c=ep.cues.find(x=>x.id===id);const el=cards.find(card=>card.dataset.beat===c?.beat);if(!el)return;const at=frameAt(frame);if(!seen.has(el)){seen.add(el);tl.set(cards.filter(card=>card!==el),{opacity:0},at);tl.fromTo(el,{opacity:0,y:28},{opacity:1,y:0,duration:.34,ease:"power3.out",immediateRender:false},at);}else{tl.fromTo(el.querySelector("h2"),{scale:1.035},{scale:1,duration:.30,immediateRender:false},at);} };__UMP_TIMELINE__tl.to('.rail',{scaleX:1,duration:.6},__UMP_DURATION__-1);window.__timelines={root:tl};</script></body></html>
