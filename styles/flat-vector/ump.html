<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=1080,height=1920"><title>UMP Flat Vector</title><script src="assets/gsap.min.js"></script><style>
:root{--ground:#FFF6E9;--ink:#151433;--accent:#2B2BFF;--secondary:#FF5A4E;--support:#FFC62B;--mint:#2EE6A8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ground)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ground);font-family:"Inter","Helvetica Neue",Arial,sans-serif}
#wipe{position:absolute;inset:0;background:var(--accent);transform-origin:bottom;z-index:1;will-change:transform}
#world{position:absolute;inset:0;z-index:2;transform-origin:50% 46%}
.hero{position:absolute;border-radius:50%;will-change:transform}
#dot{width:210px;height:210px;left:435px;top:430px;background:var(--secondary)}
#sun{width:300px;height:300px;left:390px;top:380px;background:var(--support);opacity:0}
#ground{position:absolute;left:0;right:0;bottom:0;height:520px;background:var(--mint);z-index:1}
#skyline{position:absolute;left:0;right:0;bottom:420px;height:420px;z-index:2}
.bld{position:absolute;bottom:0;background:var(--accent);border-radius:10px 10px 0 0;opacity:0}
.bld:nth-child(2n){background:var(--ink)}
.bld:nth-child(3n){background:var(--secondary)}
#beat{position:absolute;left:96px;right:96px;bottom:210px;z-index:6;opacity:0}
#beat .tag{display:inline-block;padding:10px 22px;border-radius:999px;background:var(--ink);color:var(--ground);font:800 30px/1 "Inter",sans-serif;letter-spacing:.14em}
#beat h1{margin-top:30px;font:900 104px/0.98 "Inter",sans-serif;color:var(--ink);letter-spacing:-.03em;text-transform:uppercase}
#beat p{margin-top:26px;font:500 42px/1.38 "Inter",sans-serif;color:var(--ink);opacity:.78;max-width:840px}
#beat .bar{width:120px;height:14px;background:var(--secondary);border-radius:8px;margin-bottom:26px}
#logo{position:absolute;left:96px;bottom:150px;z-index:7;opacity:0;font:900 54px/1 "Inter",sans-serif;color:var(--ink);letter-spacing:-.02em}
#logo span{color:var(--accent)}
</style></head><body data-composition-id="root" data-width="1080" data-height="1920" data-fps="30" data-duration="__UMP_DURATION__">
<div id="cards" style="display:none">__UMP_CARDS__</div>
<div id="stage">
  <div id="world">
    <div id="ground"></div>
    <svg id="skyline" viewBox="0 0 1080 420" preserveAspectRatio="none"></svg>
    <div id="sun" class="hero"></div>
    <div id="dot" class="hero"></div>
  </div>
  <div id="wipe"></div>
  <div id="beat"><div class="bar"></div><div class="tag"></div><h1></h1><p></p></div>
  <div id="logo">UMP <span>·</span> flat</div>
</div>
<script>
const EP = __UMP_EPISODE__;
const DURATION = __UMP_DURATION__;
/* Cards arrive as markup in #cards; read them from the DOM rather than as JSON. */
const CARDS_NODES = Array.prototype.slice.call(document.querySelectorAll('#cards .beat'));
const CARDS_DATA = CARDS_NODES.map(function(el){
  return {
    tag: (el.querySelector('.label') || {}).textContent || '',
    headline: (el.querySelector('h2') || {}).textContent || '',
    body: (el.querySelector('p') || {}).textContent || ''
  };
});

const OVERSHOOT = "back.out(2.1)";
const stage = document.getElementById('stage');
const skyline = document.getElementById('skyline');
const HEROES = ['dot','sun'];

/* Buildings are flat primitives on a baseline, 3-frame stagger, own mini overshoot. */
const BUILDINGS = [
  [40,120],[180,210],[320,160],[470,280],[620,190],[760,240],[900,140]
];
BUILDINGS.forEach(function(b,i){
  const r = document.createElementNS('http://www.w3.org/2000/svg','rect');
  r.setAttribute('x', b[0]); r.setAttribute('class','bld');
  r.setAttribute('width', 110); r.setAttribute('height', b[1]);
  r.setAttribute('y', 420 - b[1]); r.setAttribute('rx', 10);
  skyline.appendChild(r);
});

function panelFor(index){
  const card = CARDS_DATA[index] || {tag:'', headline:'', body:''};
  return {
    tag: card.tag || ('B ' + String(index+1).padStart(3,'0')),
    headline: card.headline || '',
    body: card.body || ''
  };
}

const tl = gsap.timeline({paused:true});
tl.fromTo('#wipe',{scaleY:0},{scaleY:1,duration:0.34,ease:'power3.in'},0);
tl.set('#wipe',{transformOrigin:'top'});
tl.to('#wipe',{scaleY:0,duration:0.30,ease:'power3.out'},0.34);

/* Hook: anticipation -> stretch -> squash -> overshoot -> settle, ~10% squash. */
tl.fromTo('#dot',{scale:0,scaleY:0.82,opacity:0},
  {scale:1,opacity:1,duration:0.22,ease:'power2.out'},0.10);
tl.fromTo('#dot',{scaleY:0.80,scaleX:1.16},{scaleY:1,scaleX:1,duration:0.26,ease:'elastic.out(1,0.55)'},0.32);

/* The dot becomes the sun: shape substitution, not a gradient. */
tl.to('#dot',{opacity:0,duration:0.16,ease:'none'},0.86);
tl.to('#sun',{opacity:1,scale:1,duration:0.30,ease:OVERSHOOT},0.92);
tl.to('#sun',{scale:1.08,duration:0.42,ease:'sine.inOut'},1.30);

/* Skyline pops up building by building, 3-frame stagger. */
tl.fromTo('.bld',{y:60,opacity:0,scaleY:0.4},
  {y:0,opacity:1,scaleY:1,duration:0.34,stagger:0.10,ease:OVERSHOOT},1.10);
tl.to('.bld',{scaleY:1.06,duration:0.18,stagger:0.04,ease:'sine.out'},2.10);

/* One hero moves at a time: the skyline settles before the camera dolly. */
tl.fromTo('#world',{scale:1},{scale:1.04,duration:DURATION,ease:'none',transformOrigin:'50% 46%'},0);

const BEAT_LEN = Math.max(1.9, DURATION / 4);
const beats = [];
CARDS_DATA.forEach(function(_,i){
  const start = 2.30 + i * BEAT_LEN;
  beats.push({start:start, i:i});
});

beats.forEach(function(b){
  const p = panelFor(b.i);
  if (b.start > DURATION - 0.4) return;
  const beat = document.getElementById('beat');
  tl.call(function(){
    beat.querySelector('.tag').textContent = p.tag;
    beat.querySelector('h1').textContent = p.headline;
    beat.querySelector('p').textContent = p.body;
  },null,b.start);
  tl.fromTo(beat,{opacity:0,y:34},{opacity:1,y:0,duration:0.30,ease:'power3.out'},b.start);
  tl.fromTo(beat.querySelector('h1'),{opacity:0,scale:0.94,transformOrigin:'left center'},
    {opacity:1,scale:1,duration:0.34,ease:OVERSHOOT},b.start+0.06);
  tl.to(beat,{opacity:0,y:-24,duration:0.26,ease:'power2.in'},b.start + BEAT_LEN - 0.30);
});

/* End card: elements collapse into the lockup, elastic settle, micro-motion hold. */
const END = DURATION - 0.9;
tl.to('#beat',{opacity:0,duration:0.24,ease:'power2.in'},END-0.30);
tl.fromTo('#logo',{opacity:0,scale:0.88},{opacity:1,scale:1,duration:0.38,ease:OVERSHOOT},END);
tl.to('#logo',{scale:1.015,duration:0.5,repeat:1,yoyo:true,ease:'sine.inOut'},END+0.40);
tl.set({},{} , DURATION);
/* shapeWipe exit uses the same element that opened the film */
tl.to('#wipe',{scaleY:0,duration:0.001,ease:'none'},DURATION);

/* flatNoGradient: only solid fills, no linear-gradient or radial-gradient anywhere */
window.__timelines={root:tl};
window.__UMP_READY__=true;
</script>
</body></html>
